name: Backend Tests

on:
  pull_request:
    paths:
      - 'packages/backend/**'
      - 'package.json'
      - 'package-lock.json'
  push:
    branches: [main]
    paths:
      - 'packages/backend/**'
      - 'package.json'
      - 'package-lock.json'

jobs:
  test:
    name: Regression suite (disposable Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: wfm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:test@localhost:5432/wfm_test
      JWT_SECRET: ci-test-secret-not-used-anywhere-real

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Prisma validate
        working-directory: packages/backend
        run: npx prisma validate --schema=prisma/schema.prisma

      - name: Prisma generate
        working-directory: packages/backend
        run: npx prisma generate --schema=prisma/schema.prisma

      - name: Typecheck
        working-directory: packages/backend
        run: npx tsc --noEmit

      - name: Build
        working-directory: packages/backend
        run: npm run build

      - name: Run regression suite
        working-directory: packages/backend
        run: npm test
