name: TEMP - Production Migration Reconciliation Check

# TEMPORARY, READ-ONLY diagnostic workflow. Manually triggered only.
# Purpose: compare packages/backend/prisma/migrations/ against production's
# _prisma_migrations bookkeeping table and the actual live schema, per
# docs/PRODUCTION-PRISMA-MIGRATION-GUARD.md section 5 ("current production
# state must always be re-verified"). This workflow is deleted once the
# reconciliation check is complete -- it exists only for this one-time read.
#
# Absolutely no writes: every statement below is SELECT-only. Uses the
# existing SUPABASE_DIRECT_URL secret (already provisioned for the Database
# Backup workflow) -- no new secret is introduced. The connection string is
# never echoed; only query results (schema metadata, never customer data)
# are printed.

on:
  workflow_dispatch:

jobs:
  reconcile:
    name: Read-only migration/schema reconciliation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends curl ca-certificates gnupg lsb-release
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /usr/share/keyrings/postgresql.gpg
          echo "deb [signed-by=/usr/share/keyrings/postgresql.gpg] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Verify secret is configured
        env:
          SUPABASE_DIRECT_URL: ${{ secrets.SUPABASE_DIRECT_URL }}
        run: |
          if [ -z "$SUPABASE_DIRECT_URL" ]; then
            echo "::error::SUPABASE_DIRECT_URL secret is not set."
            exit 1
          fi

      - name: Query _prisma_migrations (read-only)
        env:
          SUPABASE_DIRECT_URL: ${{ secrets.SUPABASE_DIRECT_URL }}
        run: |
          echo "## _prisma_migrations" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          PGCONNECT_TIMEOUT=20 psql "$SUPABASE_DIRECT_URL" -v ON_ERROR_STOP=1 -A -F' | ' -c "
            SELECT migration_name, started_at, finished_at, rolled_back_at, applied_steps_count
            FROM \"_prisma_migrations\"
            ORDER BY started_at;
          " 2>&1 | tee /tmp/migrations_out.txt | sed -E 's#(postgres(ql)?://)[^[:space:]]*#\1[REDACTED]#gI' | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Query live schema metadata (read-only, no customer data)
        env:
          SUPABASE_DIRECT_URL: ${{ secrets.SUPABASE_DIRECT_URL }}
        run: |
          echo "## Schema effect checks" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          PGCONNECT_TIMEOUT=20 psql "$SUPABASE_DIRECT_URL" -v ON_ERROR_STOP=1 -A -F' | ' -c "
            SELECT 'table:users' AS check_name, EXISTS(SELECT 1 FROM information_schema.tables WHERE table_schema='public' AND table_name='users') AS present
            UNION ALL SELECT 'table:customers', EXISTS(SELECT 1 FROM information_schema.tables WHERE table_schema='public' AND table_name='customers')
            UNION ALL SELECT 'table:addresses', EXISTS(SELECT 1 FROM information_schema.tables WHERE table_schema='public' AND table_name='addresses')
            UNION ALL SELECT 'table:appointments', EXISTS(SELECT 1 FROM information_schema.tables WHERE table_schema='public' AND table_name='appointments')
            UNION ALL SELECT 'table:notifications', EXISTS(SELECT 1 FROM information_schema.tables WHERE table_schema='public' AND table_name='notifications')
            UNION ALL SELECT 'table:messages', EXISTS(SELECT 1 FROM information_schema.tables WHERE table_schema='public' AND table_name='messages')
            UNION ALL SELECT 'table:audit_logs', EXISTS(SELECT 1 FROM information_schema.tables WHERE table_schema='public' AND table_name='audit_logs')
            UNION ALL SELECT 'table:user_settings', EXISTS(SELECT 1 FROM information_schema.tables WHERE table_schema='public' AND table_name='user_settings')
            UNION ALL SELECT 'table:call_reports', EXISTS(SELECT 1 FROM information_schema.tables WHERE table_schema='public' AND table_name='call_reports')
            UNION ALL SELECT 'table:expenses', EXISTS(SELECT 1 FROM information_schema.tables WHERE table_schema='public' AND table_name='expenses')
            UNION ALL SELECT 'table:urgent_visit_records', EXISTS(SELECT 1 FROM information_schema.tables WHERE table_schema='public' AND table_name='urgent_visit_records')
            UNION ALL SELECT 'column:customers.installationDate', EXISTS(SELECT 1 FROM information_schema.columns WHERE table_schema='public' AND table_name='customers' AND column_name='installationDate')
            UNION ALL SELECT 'column:appointments.isUrgent', EXISTS(SELECT 1 FROM information_schema.columns WHERE table_schema='public' AND table_name='appointments' AND column_name='isUrgent')
            UNION ALL SELECT 'column:appointments.urgentLocation', EXISTS(SELECT 1 FROM information_schema.columns WHERE table_schema='public' AND table_name='appointments' AND column_name='urgentLocation')
            UNION ALL SELECT 'table:maintenance_tasks (expect DROPPED)', NOT EXISTS(SELECT 1 FROM information_schema.tables WHERE table_schema='public' AND table_name='maintenance_tasks')
            UNION ALL SELECT 'table:task_history (expect DROPPED)', NOT EXISTS(SELECT 1 FROM information_schema.tables WHERE table_schema='public' AND table_name='task_history')
            UNION ALL SELECT 'column:customers.version', EXISTS(SELECT 1 FROM information_schema.columns WHERE table_schema='public' AND table_name='customers' AND column_name='version')
            UNION ALL SELECT 'column:appointments.version', EXISTS(SELECT 1 FROM information_schema.columns WHERE table_schema='public' AND table_name='appointments' AND column_name='version')
            UNION ALL SELECT 'column:appointments.technicianId', EXISTS(SELECT 1 FROM information_schema.columns WHERE table_schema='public' AND table_name='appointments' AND column_name='technicianId')
            UNION ALL SELECT 'column:appointments.workStatus', EXISTS(SELECT 1 FROM information_schema.columns WHERE table_schema='public' AND table_name='appointments' AND column_name='workStatus')
            UNION ALL SELECT 'column:postponement_records.appointmentId', EXISTS(SELECT 1 FROM information_schema.columns WHERE table_schema='public' AND table_name='postponement_records' AND column_name='appointmentId')
            UNION ALL SELECT 'table:system_configs', EXISTS(SELECT 1 FROM information_schema.tables WHERE table_schema='public' AND table_name='system_configs')
            UNION ALL SELECT 'table:event_logs', EXISTS(SELECT 1 FROM information_schema.tables WHERE table_schema='public' AND table_name='event_logs')
            UNION ALL SELECT 'table:direct_messages', EXISTS(SELECT 1 FROM information_schema.tables WHERE table_schema='public' AND table_name='direct_messages')
            UNION ALL SELECT 'index:audit_logs_entityType_entityId_idx', EXISTS(SELECT 1 FROM pg_indexes WHERE schemaname='public' AND indexname='audit_logs_entityType_entityId_idx')
            UNION ALL SELECT 'index:audit_logs_userId_idx', EXISTS(SELECT 1 FROM pg_indexes WHERE schemaname='public' AND indexname='audit_logs_userId_idx')
            UNION ALL SELECT 'index:audit_logs_createdAt_idx', EXISTS(SELECT 1 FROM pg_indexes WHERE schemaname='public' AND indexname='audit_logs_createdAt_idx')
            UNION ALL SELECT 'column:customers.activityDismissed', EXISTS(SELECT 1 FROM information_schema.columns WHERE table_schema='public' AND table_name='customers' AND column_name='activityDismissed')
            UNION ALL SELECT 'column:audit_logs.beforeState', EXISTS(SELECT 1 FROM information_schema.columns WHERE table_schema='public' AND table_name='audit_logs' AND column_name='beforeState')
            UNION ALL SELECT 'fk:appointments_customerId_fkey delete_rule=SET NULL', EXISTS(SELECT 1 FROM information_schema.referential_constraints WHERE constraint_schema='public' AND constraint_name='appointments_customerId_fkey' AND delete_rule='SET NULL')
            UNION ALL SELECT 'column:appointments.visibleToTechnician', EXISTS(SELECT 1 FROM information_schema.columns WHERE table_schema='public' AND table_name='appointments' AND column_name='visibleToTechnician')
            UNION ALL SELECT 'column:appointments.nextMaintenanceNote', EXISTS(SELECT 1 FROM information_schema.columns WHERE table_schema='public' AND table_name='appointments' AND column_name='nextMaintenanceNote')
            UNION ALL SELECT 'column:appointments.actualCompletionDate', EXISTS(SELECT 1 FROM information_schema.columns WHERE table_schema='public' AND table_name='appointments' AND column_name='actualCompletionDate')
            UNION ALL SELECT 'column:appointments.maintenanceConfirmed', EXISTS(SELECT 1 FROM information_schema.columns WHERE table_schema='public' AND table_name='appointments' AND column_name='maintenanceConfirmed')
            UNION ALL SELECT 'column:appointments.completionTechnicianName', EXISTS(SELECT 1 FROM information_schema.columns WHERE table_schema='public' AND table_name='appointments' AND column_name='completionTechnicianName')
            UNION ALL SELECT 'column:customers.secondaryPhone', EXISTS(SELECT 1 FROM information_schema.columns WHERE table_schema='public' AND table_name='customers' AND column_name='secondaryPhone')
            UNION ALL SELECT 'column:customers.previousServiceDate', EXISTS(SELECT 1 FROM information_schema.columns WHERE table_schema='public' AND table_name='customers' AND column_name='previousServiceDate')
            UNION ALL SELECT 'column:customers.previousServiceNote', EXISTS(SELECT 1 FROM information_schema.columns WHERE table_schema='public' AND table_name='customers' AND column_name='previousServiceNote')
            UNION ALL SELECT 'column:customers.previousServiceType', EXISTS(SELECT 1 FROM information_schema.columns WHERE table_schema='public' AND table_name='customers' AND column_name='previousServiceType')
            UNION ALL SELECT 'type:customers.maintenanceFrequency=double precision', (SELECT data_type FROM information_schema.columns WHERE table_schema='public' AND table_name='customers' AND column_name='maintenanceFrequency') = 'double precision'
            ORDER BY 1;
          " 2>&1 | tee /tmp/schema_out.txt | sed -E 's#(postgres(ql)?://)[^[:space:]]*#\1[REDACTED]#gI' | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Migration directory listing (repository side, for cross-reference)
        run: |
          echo "## Repository migrations/ (chronological)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          ls packages/backend/prisma/migrations | grep -v migration_lock.toml | sort >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
