name: Database Backup

# Runs daily at 02:00 UTC.
# Also supports manual trigger from the GitHub Actions UI (workflow_dispatch).
# On failure, GitHub automatically emails the repository owner.

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual backup (optional)'
        required: false
        default: 'Manual backup'

jobs:
  backup:
    name: pg_dump → artifact → restore verification
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Isolated, disposable target for restore verification (Issue #8) -- this is a
    # bare empty database. It never receives production credentials; only the backup
    # archive produced two steps earlier is ever restored into it, over localhost,
    # inside this job's own throwaway runner.
    services:
      restore_target:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: wfm_restore_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      # Required so the restore-verification steps below (Issue #8) have repository
      # files to work with -- this job originally only ran pg_dump against a remote
      # URL and never checked out the repo. Without this, $GITHUB_WORKSPACE is empty,
      # which is why actions/setup-node's npm cache step below could not find any
      # lockfile at all ("Dependencies lock file is not found").
      - uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends curl ca-certificates gnupg lsb-release

          # Ubuntu's default "postgresql-client" package trails behind the PostgreSQL
          # major version Supabase actually runs (production is 17.x; Ubuntu's default
          # package is 16.x, which pg_dump/pg_restore refuse to use against a newer
          # server: "pg_dump: error: aborting because of server version mismatch").
          # Add the official PGDG apt repository so we install matching v17 client
          # tools instead of relying on whatever Ubuntu ships by default.
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /usr/share/keyrings/postgresql.gpg
          echo "deb [signed-by=/usr/share/keyrings/postgresql.gpg] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client-17

          # Put the v17 binaries ahead of any other postgresql-client version on PATH
          # for this and all subsequent steps, and print the resolved version so a
          # future mismatch is visible in the log rather than silent.
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          export PATH="/usr/lib/postgresql/17/bin:$PATH"
          echo "Resolved: $(pg_dump --version)"
          echo "Resolved: $(pg_restore --version)"
          echo "Resolved: $(psql --version)"

      # ── Create the backup ────────────────────────────────────────────────────
      # NOTE: despite the secret's name, it is expected to hold the Supabase
      # Session Pooler URI (port 5432), not the IPv6-only Direct Connection --
      # GitHub Actions runners cannot reach the direct host ("Network is
      # unreachable"). The pooler enforces a small per-project session limit
      # (pool_size), so pg_dump can transiently fail with EMAXCONNSESSION
      # ("max clients reached in session mode") whenever the pool is briefly
      # saturated by other connections. That failure clears on its own once a
      # slot frees up, so this step retries with a bounded, backing-off delay
      # instead of failing the whole workflow on the first collision.
      - name: Create pg_dump
        env:
          SUPABASE_DIRECT_URL: ${{ secrets.SUPABASE_DIRECT_URL }}
        run: |
          if [ -z "$SUPABASE_DIRECT_URL" ]; then
            echo "::error::SUPABASE_DIRECT_URL secret is not set. Add it under Settings → Secrets → Actions."
            exit 1
          fi

          TIMESTAMP=$(date -u +%Y%m%d-%H%M%S)
          FILENAME="wfm-backup-${TIMESTAMP}.dump"

          MAX_ATTEMPTS=5
          BACKOFFS=(10 20 30 45) # seconds between attempts; 4 gaps across 5 attempts

          ATTEMPT=1
          while :; do
            echo "::notice::pg_dump attempt ${ATTEMPT}/${MAX_ATTEMPTS}..."
            ERR_LOG="$(mktemp)"

            # WFM owns every application table exclusively in the "public" schema
            # (confirmed: no @@schema/multi-schema use in prisma/schema.prisma, no
            # raw SQL referencing any other schema anywhere in the backend, and WFM
            # does not use Supabase Vault). Scoping to --schema=public is a positive
            # inclusion of exactly what WFM owns, and excludes Supabase-managed
            # platform internals (auth, storage, realtime, vault/supabase_vault,
            # extensions, etc.) that a standalone restore-verification database
            # cannot and should not attempt to recreate.
            if pg_dump \
              "$SUPABASE_DIRECT_URL" \
              --format=custom \
              --no-acl \
              --no-owner \
              --compress=9 \
              --schema=public \
              --file="${FILENAME}" 2> "$ERR_LOG"; then
              rm -f "$ERR_LOG"
              break
            fi

            # Best-effort classification for the log only -- retry/exit behavior
            # never depends on this, it's purely to help a human triage faster.
            if grep -qiE 'max clients|too many clients|EMAXCONNSESSION|remaining connection slots' "$ERR_LOG"; then
              REASON="temporary session-pool saturation"
            elif grep -qiE 'password authentication failed|role .* does not exist' "$ERR_LOG"; then
              REASON="authentication failure"
            elif grep -qiE 'network is unreachable|could not translate host name|temporary failure in name resolution|connection timed out' "$ERR_LOG"; then
              REASON="DNS/network failure"
            else
              REASON="pg_dump command failure"
            fi

            # Show pg_dump's diagnostic output with any embedded connection string
            # redacted, so the failure is debuggable without ever logging the secret.
            echo "pg_dump stderr (connection string redacted):"
            sed -E 's#(postgres(ql)?://)[^[:space:]]*#\1[REDACTED]#gI' "$ERR_LOG"
            rm -f "$ERR_LOG"

            if [ "$ATTEMPT" -ge "$MAX_ATTEMPTS" ]; then
              echo "::error::pg_dump failed after ${MAX_ATTEMPTS} attempts (last failure: ${REASON}). Backup NOT created."
              exit 1
            fi

            WAIT="${BACKOFFS[$((ATTEMPT-1))]}"
            echo "pg_dump attempt ${ATTEMPT} failed (${REASON}). Retrying in ${WAIT}s..."
            sleep "$WAIT"
            ATTEMPT=$((ATTEMPT+1))
          done

          echo "BACKUP_FILE=${FILENAME}" >> "$GITHUB_ENV"
          echo "BACKUP_TIMESTAMP=${TIMESTAMP}"  >> "$GITHUB_ENV"

      # ── Verify the dump is readable ─────────────────────────────────────────
      - name: Verify backup integrity
        run: |
          if [ ! -s "${{ env.BACKUP_FILE }}" ]; then
            echo "::error::Backup file is empty or missing: ${{ env.BACKUP_FILE }}"
            exit 1
          fi

          SIZE_BYTES=$(stat -c%s "${{ env.BACKUP_FILE }}")
          SIZE_KB=$(( SIZE_BYTES / 1024 ))

          # pg_restore --list reads the table of contents without restoring anything.
          # If the dump is corrupt this command exits non-zero.
          OBJECT_COUNT=$(pg_restore --list "${{ env.BACKUP_FILE }}" | grep -v '^;' | wc -l)

          echo "Backup file  : ${{ env.BACKUP_FILE }}"
          echo "Size         : ${SIZE_KB} KB"
          echo "Object count : ${OBJECT_COUNT}"

          if [ "$OBJECT_COUNT" -lt 5 ]; then
            echo "::error::Backup contains only ${OBJECT_COUNT} objects — suspiciously low, check database connectivity."
            exit 1
          fi

          echo "::notice::Backup integrity OK — ${SIZE_KB} KB, ${OBJECT_COUNT} objects"

      # ── Store as a GitHub Actions artifact (90-day retention) ───────────────
      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: wfm-db-backup-${{ env.BACKUP_TIMESTAMP }}
          path: ${{ env.BACKUP_FILE }}
          retention-days: 90
          if-no-files-found: error

      # ── Restore the backup just created into the disposable service above, and ──
      # ── run structural + logical verification (Issue #8). Runs after the artifact ──
      # ── is already uploaded, so a failed restore never costs the backup itself. ──
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install backend dependencies
        run: npm install --workspace=packages/backend --no-audit --no-fund

      - name: Generate Prisma client
        working-directory: packages/backend
        run: npx prisma generate --schema=prisma/schema.prisma

      - name: Verify backup restores cleanly
        working-directory: packages/backend
        env:
          RESTORE_TEST_DATABASE_URL: postgresql://postgres:test@localhost:5433/wfm_restore_test
        run: npm run backup:verify -- "$GITHUB_WORKSPACE/${{ env.BACKUP_FILE }}"

      # ── Print summary to the workflow log ───────────────────────────────────
      - name: Summary
        run: |
          SIZE_KB=$(( $(stat -c%s "${{ env.BACKUP_FILE }}") / 1024 ))
          EXPIRES=$(date -u -d '+90 days' +%Y-%m-%d)
          echo "### Backup complete" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| File | \`${{ env.BACKUP_FILE }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Size | ${SIZE_KB} KB |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Artifact | \`wfm-db-backup-${{ env.BACKUP_TIMESTAMP }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Retention | 90 days |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Expires | ${EXPIRES} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Trigger | ${{ github.event_name }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Restore verified | ✅ Yes — restored into an isolated disposable database and validated |" >> "$GITHUB_STEP_SUMMARY"
