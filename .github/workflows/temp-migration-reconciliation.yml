name: TEMPORARY - Production Migration Reconciliation

# One-time, manually-triggered workflow to bring production's _prisma_migrations
# history in line with the repository's migration chain (resolves M5/M6 as
# applied -- their full schema effect is already present in production --
# then deploys M7 for real, since its FK CASCADE->SET NULL effect is
# confirmed NOT yet present). See docs/PRODUCTION-PRISMA-MIGRATION-GUARD.md.
#
# workflow_dispatch ONLY -- never runs on push/PR/schedule. Delete this file
# in a follow-up PR immediately after a successful run so it cannot be
# accidentally re-triggered later.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type RECONCILE to confirm you intend to modify production migration history'
        required: true

jobs:
  reconcile:
    name: Resolve M5/M6, deploy M7
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event.inputs.confirm == 'RECONCILE'
    env:
      DATABASE_URL: ${{ secrets.SUPABASE_DIRECT_URL }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        working-directory: packages/backend
        run: npx prisma generate --schema=prisma/schema.prisma

      - name: Safety check -- M7 migration.sql contains no destructive statements
        working-directory: packages/backend
        run: |
          FILE="prisma/migrations/20260627000000_appointments_customer_fk_set_null/migration.sql"
          echo "----- M7 migration.sql contents -----"
          cat "$FILE"
          echo "--------------------------------------"
          if grep -qiE '\b(DROP[[:space:]]+TABLE|DELETE[[:space:]]+FROM|DROP[[:space:]]+COLUMN|TRUNCATE)\b' "$FILE"; then
            echo "::error::M7 migration.sql contains a disallowed destructive statement. Aborting before any production change."
            exit 1
          fi
          echo "Confirmed: no DROP TABLE / DELETE FROM / DROP COLUMN / TRUNCATE present."

      - name: Safety check -- re-confirm no orphaned appointments.customerId references
        working-directory: packages/backend
        run: |
          node -e "
            const { PrismaClient } = require('@prisma/client');
            const prisma = new PrismaClient();
            (async () => {
              const rows = await prisma.\$queryRawUnsafe(
                'SELECT COUNT(*)::int AS count FROM appointments a WHERE a.\"customerId\" IS NOT NULL AND NOT EXISTS (SELECT 1 FROM customers c WHERE c.id = a.\"customerId\")'
              );
              const count = rows[0].count;
              console.log('Orphaned appointments.customerId references:', count);
              await prisma.\$disconnect();
              if (count !== 0) { console.error('::error::Orphaned references found -- aborting before M7 deploy.'); process.exit(1); }
            })().catch(e => { console.error('::error::' + (e.message || e)); process.exit(1); });
          "

      - name: STEP 1 -- Resolve M5 as applied
        working-directory: packages/backend
        run: npx prisma migrate resolve --applied 20260625000000_remove_tasks_system_and_add_versioning --schema=prisma/schema.prisma

      - name: STEP 1 -- Verify status after M5
        working-directory: packages/backend
        run: npx prisma migrate status --schema=prisma/schema.prisma

      - name: STEP 2 -- Resolve M6 as applied
        working-directory: packages/backend
        run: npx prisma migrate resolve --applied 20260626000000_system_configs_and_remaining_columns --schema=prisma/schema.prisma

      - name: STEP 2 -- Verify status after M6
        working-directory: packages/backend
        run: npx prisma migrate status --schema=prisma/schema.prisma

      - name: STEP 3 -- Deploy M7 (real DDL, appointments FK CASCADE -> SET NULL)
        working-directory: packages/backend
        run: npx prisma migrate deploy --schema=prisma/schema.prisma

      - name: Post-deploy -- migrate status
        working-directory: packages/backend
        run: npx prisma migrate status --schema=prisma/schema.prisma

      - name: Post-deploy -- read-only reconciliation verification
        working-directory: packages/backend
        run: npm run migration:verify-reconciliation
