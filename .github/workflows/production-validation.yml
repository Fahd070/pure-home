name: Production Validation

# No path filters: this is the required status check gating merges to main (see
# docs/CI-DEPLOYMENT-GATE.md), so it must run on every PR targeting main and every
# push to main -- a path-filtered required check that sometimes doesn't run at all
# leaves affected PRs permanently stuck as "waiting for status" in GitHub's UI.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate:
    name: Production Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: wfm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:test@localhost:5432/wfm_test
      JWT_SECRET: ci-test-secret-not-used-anywhere-real

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Prisma validate
        working-directory: packages/backend
        run: npx prisma validate --schema=prisma/schema.prisma

      - name: Prisma generate
        working-directory: packages/backend
        run: npx prisma generate --schema=prisma/schema.prisma

      - name: Prisma migrate deploy (disposable test database)
        working-directory: packages/backend
        run: npx prisma migrate deploy --schema=prisma/schema.prisma

      - name: Backend typecheck
        working-directory: packages/backend
        run: npx tsc --noEmit

      - name: Backend production build
        working-directory: packages/backend
        run: npm run build

      - name: Backend regression suite
        working-directory: packages/backend
        run: npm test

      - name: Web regression suite
        working-directory: packages/web
        run: npm test

      - name: Web production build
        run: npm run build:web

      - name: Unified-app (Electron) TypeScript check
        working-directory: packages/unified-app
        run: npx tsc -b

      - name: Unified-app (Electron) renderer/main/preload build
        # electron-vite only -- not the full `npm run build`, which also invokes
        # electron-builder's NSIS/Windows installer packaging + native module
        # rebuild + code signing. That step is platform-specific and impractical
        # on this Linux runner; the JS bundling step below is what would actually
        # catch a code-level break, and runs cross-platform in a few seconds.
        working-directory: packages/unified-app
        run: npx electron-vite build
