name: TEMPORARY - Deploy Next Maintenance Note Migration

# One-time, manually-triggered workflow to apply the single new migration
# 20260629000000_add_appointment_next_maintenance_note to production, BEFORE any
# application code that depends on it is deployed. Scope is strictly limited to
# this one additive migration (ADD COLUMN "nextMaintenanceNote" TEXT) -- no
# schema/migration file changes, no other migration, no db push, no manual
# _prisma_migrations edits, no business-data changes.
#
# Deliberately deployed ahead of the Modification #6 application code (routes,
# UI, amount-privacy fixes), which is a separate, not-yet-merged PR: after
# Modification #5's outage (code shipped before its migration), the safe order
# is migration-first, verified, then code.
#
# workflow_dispatch ONLY -- never runs on push/PR/schedule. Delete this file in
# a follow-up PR immediately after a successful run.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DEPLOY to confirm you intend to apply this migration to production'
        required: true

jobs:
  deploy-migration:
    name: Deploy 20260629000000_add_appointment_next_maintenance_note
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event.inputs.confirm == 'DEPLOY'
    env:
      DATABASE_URL: ${{ secrets.SUPABASE_DIRECT_URL }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        working-directory: packages/backend
        run: npx prisma generate --schema=prisma/schema.prisma

      - name: BEFORE -- migrate status (expect exactly one pending migration)
        working-directory: packages/backend
        run: |
          set +e
          OUTPUT=$(npx prisma migrate status --schema=prisma/schema.prisma 2>&1)
          echo "$OUTPUT"
          set -e
          if ! echo "$OUTPUT" | grep -q "20260629000000_add_appointment_next_maintenance_note"; then
            echo "::error::Expected pending migration 20260629000000_add_appointment_next_maintenance_note not listed. Aborting."
            exit 1
          fi
          PENDING_COUNT=$(echo "$OUTPUT" | grep -cE '^\s*20[0-9]{12}_')
          if [ "$PENDING_COUNT" -ne 1 ]; then
            echo "::error::Expected exactly 1 pending migration, found $PENDING_COUNT. Aborting -- scope must be limited to the next-maintenance-note migration only."
            exit 1
          fi
          echo "Confirmed: exactly one pending migration, and it is the expected one."

      - name: Safety check -- migration.sql is additive only, no destructive statements
        working-directory: packages/backend
        run: |
          FILE="prisma/migrations/20260629000000_add_appointment_next_maintenance_note/migration.sql"
          echo "----- migration.sql contents -----"
          cat "$FILE"
          echo "-----------------------------------"
          if grep -qiE '\b(DROP[[:space:]]+TABLE|DELETE[[:space:]]+FROM|DROP[[:space:]]+COLUMN|TRUNCATE|ALTER[[:space:]]+COLUMN)\b' "$FILE"; then
            echo "::error::migration.sql contains a disallowed destructive/altering statement. Aborting before any production change."
            exit 1
          fi
          if ! grep -qiE '\bADD[[:space:]]+COLUMN\b' "$FILE"; then
            echo "::error::migration.sql does not contain an ADD COLUMN statement as expected. Aborting."
            exit 1
          fi
          echo "Confirmed: additive-only (ADD COLUMN), no destructive statements."

      - name: DEPLOY -- apply the migration
        working-directory: packages/backend
        run: npx prisma migrate deploy --schema=prisma/schema.prisma

      - name: AFTER -- migrate status (expect schema up to date)
        working-directory: packages/backend
        run: npx prisma migrate status --schema=prisma/schema.prisma

      - name: AFTER -- verify nextMaintenanceNote column (name, nullability, type only -- no data)
        working-directory: packages/backend
        run: |
          node -e "
            const { PrismaClient } = require('@prisma/client');
            const prisma = new PrismaClient();
            (async () => {
              const rows = await prisma.\$queryRawUnsafe(
                \"SELECT column_name, is_nullable, data_type FROM information_schema.columns WHERE table_name = 'appointments' AND column_name = 'nextMaintenanceNote'\"
              );
              console.log(JSON.stringify(rows));
              await prisma.\$disconnect();
              if (rows.length !== 1) { console.error('::error::Column not found.'); process.exit(1); }
              const col = rows[0];
              if (col.is_nullable !== 'YES') { console.error('::error::Column is NOT NULL, expected nullable.'); process.exit(1); }
              if (col.data_type !== 'text') { console.error('::error::Column type is not text.'); process.exit(1); }
              console.log('Confirmed: nextMaintenanceNote exists, nullable, text.');
            })().catch(e => { console.error('::error::' + (e.message || e)); process.exit(1); });
          "

      - name: AFTER -- production /health check
        run: |
          for i in 1 2 3 4 5; do
            RESPONSE=$(curl -s -w '\n%{http_code}' https://wfm-system.onrender.com/health)
            CODE=$(echo "$RESPONSE" | tail -n1)
            BODY=$(echo "$RESPONSE" | head -n -1)
            echo "Attempt $i: HTTP $CODE -- $BODY"
            if [ "$CODE" = "200" ] && echo "$BODY" | grep -q '"database":"connected"'; then
              echo "Health check passed."
              exit 0
            fi
            sleep 5
          done
          echo "::error::Health check did not pass after 5 attempts."
          exit 1
