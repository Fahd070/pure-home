name: TEMP - Deploy customer-installation-details migration v2

# TEMPORARY, single-purpose, manually-triggered workflow (corrected version --
# see v1 for why: checking out `main` alone doesn't contain the new migration
# file while PR #62 is intentionally still unmerged). This version explicitly
# checks out PR #62's exact, already-reviewed, already-Production-Validated
# head SHA for the workspace Prisma operates in, while the workflow
# *definition* itself still lives on main (required for workflow_dispatch to
# be dispatchable at all).
#
# Deploys exactly one migration (20260818194741_add_customer_installation_details)
# to production via `prisma migrate deploy`, after a multi-step safety gate.
# Removed immediately after this one-time deployment is confirmed successful.
#
# Uses the existing SUPABASE_DIRECT_URL secret (already provisioned for the
# Database Backup workflow) -- no new secret is introduced. The secret is
# never echoed; every command's output that could contain it is redacted
# before being written to logs or the step summary.

on:
  workflow_dispatch:

jobs:
  deploy-migration:
    name: Verify + deploy the single expected migration
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      EXPECTED_MIGRATION: 20260818194741_add_customer_installation_details
      EXPECTED_HEAD_SHA: f5ce213c301d48a928772b7f6a6a80626737ad70
      EXPECTED_MIGRATION_COUNT: 14

    steps:
      # Pinned to PR #62's exact, already-Production-Validated head -- NOT
      # main, and NOT the branch's moving tip. This is the whole point of v2.
      - uses: actions/checkout@v4
        with:
          ref: f5ce213c301d48a928772b7f6a6a80626737ad70

      - name: Verify secret is configured
        env:
          SUPABASE_DIRECT_URL: ${{ secrets.SUPABASE_DIRECT_URL }}
        run: |
          if [ -z "$SUPABASE_DIRECT_URL" ]; then
            echo "::error::SUPABASE_DIRECT_URL secret is not set."
            exit 1
          fi

      # ── Safety gate, part 1: workspace identity (no DB access yet) ──────────
      - name: Verify checked-out workspace is exactly the expected PR #62 head
        run: |
          ACTUAL_SHA=$(git rev-parse HEAD)
          echo "## Workspace identity check" >> "$GITHUB_STEP_SUMMARY"
          echo "Expected HEAD: \`${EXPECTED_HEAD_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Actual HEAD:   \`${ACTUAL_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          if [ "$ACTUAL_SHA" != "$EXPECTED_HEAD_SHA" ]; then
            echo "::error::Checked-out HEAD ($ACTUAL_SHA) does not match expected PR #62 head ($EXPECTED_HEAD_SHA). Refusing to proceed."
            exit 1
          fi

      - name: Verify repository migration count and newest migration name
        working-directory: packages/backend
        run: |
          MIGRATION_LIST=$(ls prisma/migrations | grep -v migration_lock.toml | sort)
          MIGRATION_COUNT=$(echo "$MIGRATION_LIST" | grep -c .)
          NEWEST_MIGRATION=$(echo "$MIGRATION_LIST" | tail -1)

          echo "## Repository migrations (chronological)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "$MIGRATION_LIST" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "Count: $MIGRATION_COUNT (expected: $EXPECTED_MIGRATION_COUNT)" >> "$GITHUB_STEP_SUMMARY"
          echo "Newest: $NEWEST_MIGRATION (expected: $EXPECTED_MIGRATION)" >> "$GITHUB_STEP_SUMMARY"

          if [ "$MIGRATION_COUNT" -ne "$EXPECTED_MIGRATION_COUNT" ]; then
            echo "::error::Migration count is $MIGRATION_COUNT, expected $EXPECTED_MIGRATION_COUNT. Refusing to proceed."
            exit 1
          fi
          if [ "$NEWEST_MIGRATION" != "$EXPECTED_MIGRATION" ]; then
            echo "::error::Newest migration is '$NEWEST_MIGRATION', expected '$EXPECTED_MIGRATION'. Refusing to proceed."
            exit 1
          fi

      - name: Inspect the target migration.sql -- must be additive nullable ADD COLUMN only
        working-directory: packages/backend
        run: |
          SQL_FILE="prisma/migrations/${EXPECTED_MIGRATION}/migration.sql"
          echo "## Target migration SQL" >> "$GITHUB_STEP_SUMMARY"
          echo '```sql' >> "$GITHUB_STEP_SUMMARY"
          cat "$SQL_FILE" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          # Only ALTER TABLE ... ADD COLUMN statements are permitted -- no
          # DROP, no TRUNCATE, no DELETE, no SET NOT NULL, no RENAME.
          if grep -qiE 'DROP |TRUNCATE|DELETE FROM|NOT NULL|RENAME' "$SQL_FILE"; then
            echo "::error::migration.sql contains a statement other than additive nullable ADD COLUMN. Refusing to proceed."
            exit 1
          fi
          if ! grep -q 'ADD COLUMN.*"installationAmount"' "$SQL_FILE" || \
             ! grep -q 'ADD COLUMN.*"installationNote"' "$SQL_FILE" || \
             ! grep -q 'ADD COLUMN.*"installationPaymentMethod"' "$SQL_FILE"; then
            echo "::error::migration.sql does not contain exactly the three expected ADD COLUMN statements. Refusing to proceed."
            exit 1
          fi
          echo "::notice::migration.sql confirmed additive-only (three nullable ADD COLUMN statements)."

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install backend dependencies
        run: npm install --workspace=packages/backend --no-audit --no-fund

      # ── Safety gate, part 2: production migration status ────────────────────
      - name: Check migration status against production (read-only) and gate the deploy
        working-directory: packages/backend
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DIRECT_URL }}
        run: |
          set +e
          npx prisma migrate status --schema=prisma/schema.prisma > /tmp/status_before.txt 2>&1
          set -e

          echo "## Migration status (before deploy)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          sed -E 's#(postgres(ql)?://)[^[:space:]]*#\1[REDACTED]#gI' /tmp/status_before.txt | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          # No OTHER migration folder name may appear anywhere in the status
          # output (pending/unapplied or otherwise flagged).
          OTHER_MIGRATIONS=$(ls prisma/migrations | grep -v migration_lock.toml | grep -v "^${EXPECTED_MIGRATION}$")
          UNEXPECTED_FOUND=0
          while IFS= read -r m; do
            [ -z "$m" ] && continue
            if grep -q "$m" /tmp/status_before.txt; then
              echo "::error::Unexpected migration '$m' appears in migrate status output. Refusing to deploy."
              UNEXPECTED_FOUND=1
            fi
          done <<< "$OTHER_MIGRATIONS"

          if [ "$UNEXPECTED_FOUND" -eq 1 ]; then
            echo "::error::Migration-history discrepancy detected -- stopping before any deploy."
            exit 1
          fi

          if ! grep -q "$EXPECTED_MIGRATION" /tmp/status_before.txt; then
            echo "::error::Expected migration '$EXPECTED_MIGRATION' was not found as pending in migrate status output. Refusing to deploy (nothing to do, or unexpected state)."
            exit 1
          fi

          echo "::notice::Safety gate passed -- '$EXPECTED_MIGRATION' is the only pending migration."

      # ── Authorized write: deploy exactly this migration ──────────────────────
      - name: prisma migrate deploy (PRODUCTION)
        working-directory: packages/backend
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DIRECT_URL }}
        run: |
          npx prisma migrate deploy --schema=prisma/schema.prisma 2>&1 | \
            sed -E 's#(postgres(ql)?://)[^[:space:]]*#\1[REDACTED]#gI' | tee /tmp/deploy_out.txt
          echo "## migrate deploy result" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/deploy_out.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Migration status (after deploy) -- expect up to date
        working-directory: packages/backend
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DIRECT_URL }}
        run: |
          echo "## Migration status (after deploy)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          npx prisma migrate status --schema=prisma/schema.prisma 2>&1 | \
            sed -E 's#(postgres(ql)?://)[^[:space:]]*#\1[REDACTED]#gI' | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Install PostgreSQL client (for read-only verification queries)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends curl ca-certificates gnupg lsb-release
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /usr/share/keyrings/postgresql.gpg
          echo "deb [signed-by=/usr/share/keyrings/postgresql.gpg] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Verify _prisma_migrations row (read-only, bookkeeping only, no application data)
        env:
          SUPABASE_DIRECT_URL: ${{ secrets.SUPABASE_DIRECT_URL }}
        run: |
          echo "## _prisma_migrations row for the deployed migration" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          PGCONNECT_TIMEOUT=20 psql "$SUPABASE_DIRECT_URL" -v ON_ERROR_STOP=1 -A -F' | ' -c "
            SELECT migration_name, started_at, finished_at, rolled_back_at, applied_steps_count
            FROM \"_prisma_migrations\"
            WHERE migration_name = '${EXPECTED_MIGRATION}';
          " 2>&1 | sed -E 's#(postgres(ql)?://)[^[:space:]]*#\1[REDACTED]#gI' | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Verify new columns only (read-only, schema metadata only, no customer data)
        env:
          SUPABASE_DIRECT_URL: ${{ secrets.SUPABASE_DIRECT_URL }}
        run: |
          echo "## New customers columns (information_schema, metadata only)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          PGCONNECT_TIMEOUT=20 psql "$SUPABASE_DIRECT_URL" -v ON_ERROR_STOP=1 -A -F' | ' -c "
            SELECT column_name, data_type, is_nullable
            FROM information_schema.columns
            WHERE table_schema = 'public' AND table_name = 'customers'
              AND column_name IN ('installationNote', 'installationAmount', 'installationPaymentMethod')
            ORDER BY column_name;
          " 2>&1 | sed -E 's#(postgres(ql)?://)[^[:space:]]*#\1[REDACTED]#gI' | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Production health check (public endpoint, no secret needed)
        run: |
          echo "## Production /health" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          curl -s https://wfm-system.onrender.com/health | tee -a "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
